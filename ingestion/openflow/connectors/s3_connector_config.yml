# Openflow S3 Connector Configuration Template
#
# This YAML documents the parameters for the S3 connector deployed via the
# Openflow Snowsight UI (Openflow → Runtime → Deploy Connector → Amazon S3).
#
# For programmatic deployment, these values are set via nipyapi in flows/*.py.
# Reference: https://docs.snowflake.com/en/user-guide/data-integration/openflow/connectors/
#
# Environment naming: {database} placeholder is resolved from pipeline_config.yml
# environments block at deploy time. DEV → SANDBOX_DEV, PROD → SANDBOX.

connector:
  name: "TPCH_S3_Connector"
  type: "Amazon S3"
  runtime: "TPCH_OPENFLOW_RUNTIME"

# S3 source configuration
source:
  bucket: "your-data-bucket"
  region: "us-east-1"
  # Credentials: use INSTANCE_PROFILE (IAM role on SPCS) — no static keys
  credentials_strategy: "INSTANCE_PROFILE"

# Two connector instances: one per source entity
instances:
  - name: "Customers"
    prefix: "customers/"
    file_pattern: "*.csv"
    schedule: "0 0 6 * * ?"         # Daily at 06:00 UTC (Quartz cron)
    record_format: "CSV"
    csv_header: true
    destination:
      database: "{database}"
      schema: "TPCH_LANDING"
      table: "CUSTOMERS_RAW"
      account: "xna38553.east-us-2.azure"
      auth_strategy: "SNOWFLAKE_MANAGED"  # SPCS session token — no key-pair needed

  - name: "Orders"
    prefix: "orders/"
    file_pattern: "*.csv"
    schedule: "0 0 0/4 * * ?"       # Every 4 hours (Quartz cron)
    record_format: "CSV"
    csv_header: true
    destination:
      database: "{database}"
      schema: "TPCH_LANDING"
      table: "ORDERS_RAW"
      account: "xna38553.east-us-2.azure"
      auth_strategy: "SNOWFLAKE_MANAGED"

# Error handling
error_handling:
  max_retries: 3
  penalize_on_retry: true
  dead_letter_queue:
    customers: "{database}.TPCH_LANDING.CUSTOMERS_DLQ"
    orders: "{database}.TPCH_LANDING.ORDERS_DLQ"

# Monitoring
monitoring:
  back_pressure_threshold_count: 10000    # Pause ListS3 if queue exceeds this
  back_pressure_threshold_size: "1 GB"
