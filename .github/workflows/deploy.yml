name: Deploy

on:
  # Automatic: push to main always deploys PROD
  push:
    branches: [main]

  # Manual: trigger on any branch, choose DEV or PROD
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "DEV"
        type: choice
        options: [DEV, PROD]
      skip_evals:
        description: "Skip agent evaluation suite"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      keep_clone:
        description: "Keep the branch clone DB after the pipeline (for inspection)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

# ── Resolve environment once for all jobs ─────────────────────────────────────
env:
  SNOWFLAKE_ACCOUNT: "xna38553.east-us-2.azure"
  SNOWFLAKE_USER:    "DBT_GITHUB_ACTIONS_SVC"
  #SNOWFLAKE_PAT: ""
  SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
  DEPLOY_ENV:  ${{ github.event_name == 'push' && 'PROD' || inputs.environment }}
  SNOW_CONN:   ${{ (github.event_name == 'push' || inputs.environment == 'PROD') && 'prod' || 'dev' }}
  DBT_TARGET:  ${{ (github.event_name == 'push' || inputs.environment == 'PROD') && 'prod' || 'dev' }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 0. Guard — block manual PROD deploys off non-main branches
  # ─────────────────────────────────────────────────────────────────────────────
  guard:
    name: Environment Guard
    runs-on: ubuntu-latest
    steps:
      - name: Block PROD deploy from non-main branch
        if: >
          github.event_name == 'workflow_dispatch' &&
          inputs.environment == 'PROD' &&
          github.ref != 'refs/heads/main'
        run: |
          echo "::error::PROD deploys are only allowed from the main branch."
          echo "::error::You are on '${{ github.ref_name }}'. Merge to main first, or select DEV."
          exit 1

      - name: Log deploy context
        run: |
          echo "## Deploy Context" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch      | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger     | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | \`${{ env.DEPLOY_ENV }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit      | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Clone DB — DEV only: zero-copy clone SANDBOX → SANDBOX_<BRANCH>
  # ─────────────────────────────────────────────────────────────────────────────
  clone-db:
    name: Create Branch Clone DB
    needs: guard
    runs-on: ubuntu-latest
    # Only runs for manual DEV dispatches — push to main (PROD) skips this job
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'DEV'
    outputs:
      clone_db: ${{ steps.set-clone-name.outputs.clone_db }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Snowflake CLI
        run: pip install snowflake-cli

      - name: Configure Snowflake connection
        run: |
          mkdir -p ~/.snowflake
          touch ~/.snowflake/config.toml
          chmod 0600 ~/.snowflake/config.toml
          cat > ~/.snowflake/config.toml << EOF
          [connections.dev]
          account       = "xna38553.east-us-2.azure"
          user          = "DBT_GITHUB_ACTIONS_SVC"
          authenticator = snowflake_jwt
          token         = "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}"
          warehouse     = "ANALYTICS_WH"
          database      = "SANDBOX"
          schema        = "TPCH"
          role          = "RETAIL_CATEGORY_ANALYTICS_ROLE"
          EOF

      - name: Compute clone database name
        id: set-clone-name
        run: |
          # Sanitize branch name: lowercase → uppercase, replace / - . with _
          # Truncate to 30 chars to stay within Snowflake identifier limits
          BRANCH="${{ github.ref_name }}"
          SAFE=$(echo "$BRANCH" | tr '[:lower:]' '[:upper:]' | tr '/.-' '_' | cut -c1-30)
          CLONE_DB="SANDBOX_${SAFE}"
          echo "clone_db=${CLONE_DB}" >> $GITHUB_OUTPUT
          echo "Clone database: ${CLONE_DB}"

          echo "| Clone DB | \`${CLONE_DB}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Create zero-copy clone of SANDBOX
        run: |
          CLONE_DB="${{ steps.set-clone-name.outputs.clone_db }}"
          snow sql -q "
            CREATE OR REPLACE DATABASE ${CLONE_DB} CLONE SANDBOX
              COMMENT = 'Branch clone for ${{ github.ref_name }} — run ${{ github.run_id }}';
          " -c dev
          echo "Created clone: ${CLONE_DB}"

      - name: Grant usage on clone to service user
        run: |
          CLONE_DB="${{ steps.set-clone-name.outputs.clone_db }}"
          snow sql -q "
            GRANT ALL PRIVILEGES ON DATABASE ${CLONE_DB} TO ROLE ACCOUNTADMIN;
          " -c dev

