  # ─────────────────────────────────────────────────────────────────────────────
  # 6. dbt — transform layer
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-dbt:
    name: Deploy dbt Models
#    needs: [deploy-ingestion, clone-db]
#    if: always() && needs.deploy-ingestion.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake

      - name: Write dbt profiles
        env: 
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.dbt
          # DEV: deploy into clone DB (schema TPCH_DEV)
          # PROD: deploy into SANDBOX (schema TPCH)
          # FORCE DBT TO USE THE ACTUAL DB (SANDBOX) INSTEAD OF THE CLONE
          DBT_DB="SANDBOX"
          
          if [ "${{ env.DEPLOY_ENV }}" = "PROD" ]; then
            DBT_SCHEMA="TPCH"
          else
            DBT_SCHEMA="TPCH_DEV"
          fi

          cat > ~/.dbt/profiles.yml << EOF
          tpch_data_platform:
            target: ${{ env.DBT_TARGET }}
            outputs:
              ${{ env.DBT_TARGET }}:
                type: snowflake
                account: "A5701997473071-MPA05784"
                user: DBT_GITHUB_ACTIONS_SVC
                authenticator: snowflake_jwt
                private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}" 
                role: RETAIL_CATEGORY_ANALYTICS_ROLE
                database: ${DBT_DB}
                warehouse: ANALYTICS_WH
                schema: ${DBT_SCHEMA}
                threads: 8
                query_tag: "dbt_${{ env.DEPLOY_ENV }}_${{ github.sha }}"
          EOF

      - name: Create Private Key File
        run: |
          # Pull the multiline secret and write it safely to a file
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" | sed 's/\\n/\n/g' > "$GITHUB_WORKSPACE/rsa_key.p8"
          chmod 600 "$GITHUB_WORKSPACE/rsa_key.p8"
          ls -la "$GITHUB_WORKSPACE/rsa_key.p8"   # confirm it exists
          
      # - name: Test Connection (dbt debug)
      #   env:
      #     # Provide the file path to dbt
      #     SNOWFLAKE_PRIVATE_KEY_PATH: "./rsa_key.p8"
      #   run: |
      #     dbt debug --profiles-dir ~/.dbt/profiles.yml

      - name: dbt deps
        run: dbt deps

      - name: dbt source freshness
        # Warn-only on DEV — clone data may not be fresh
        env:
          DBT_DB: ${{ env.DEPLOY_ENV == 'PROD' && 'SANDBOX' || needs.clone-db.outputs.clone_db }}
        run: |
          dbt source freshness --vars "{\"source_database\": \"${DBT_DB}\"}" || $( [ "${{ env.DEPLOY_ENV }}" = "DEV" ] && echo "true" || echo "false" )
          
      - name: dbt debug
        env:
          SNOWFLAKE_PRIVATE_KEY_PATH: "${{ github.workspace }}/rsa_key.p8"
          DBT_DB: ${{ env.DEPLOY_ENV == 'PROD' && 'SANDBOX' || needs.clone-db.outputs.clone_db }}
        run: |
          cat ~/.dbt/profiles.yml
          grep -v token ~/.dbt/profiles.yml
          echo SNOWFLAKE_PRIVATE_KEY_PATH
          ls -la "$GITHUB_WORKSPACE/rsa_key.p8"   # confirm it's still there
          dbt debug

      - name: dbt run
        env:
          DBT_DB: ${{ env.DEPLOY_ENV == 'PROD' && 'SANDBOX' || needs.clone-db.outputs.clone_db }}
        run: |
          dbt run --target ${{ env.DBT_TARGET }} --vars "{\"source_database\": \"${DBT_DB}\"}"

      - name: dbt test
        env:
          DBT_DB: ${{ env.DEPLOY_ENV == 'PROD' && 'SANDBOX' || needs.clone-db.outputs.clone_db }}
        run: |
          dbt test --target ${{ env.DBT_TARGET }} --vars "{\"source_database\": \"${DBT_DB}\"}"

      - name: dbt snapshot
        env:
          DBT_DB: ${{ env.DEPLOY_ENV == 'PROD' && 'SANDBOX' || needs.clone-db.outputs.clone_db }}
        run: |
          dbt snapshot --target ${{ env.DBT_TARGET }} --vars "{\"source_database\": \"${DBT_DB}\"}"

