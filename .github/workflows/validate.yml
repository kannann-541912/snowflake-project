name: Validate (PR)

on:
  pull_request:
    branches: [main]

env:
  SNOWFLAKE_ACCOUNT: "xna38553.east-us-2.azure"
  SNOWFLAKE_USER: "MCP_SERVICE_USER"

jobs:
  validate-dcm:
    name: DCM Analyze & Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Snowflake CLI
        run: pip install snowflake-cli

      - name: Configure Snowflake connection
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/config.toml << EOF
          [connections.ci]
          account       = "xna38553.east-us-2.azure"
          user          = "MCP_SERVICE_USER"
          authenticator = "PROGRAMMATIC_ACCESS_TOKEN"
          token         = "${{ secrets.SNOWFLAKE_PAT }}"
          warehouse     = "ANALYTICS_WH"
          database      = "SANDBOX"
          schema        = "TPCH"
          role          = "SYSADMIN"
          EOF

      - name: DCM Analyze
        run: snow dcm raw-analyze --target DEV -c ci

      - name: DCM Plan (dry-run)
        run: snow dcm plan --target DEV -c ci

      - name: Show plan results
        if: always()
        run: |
          if [ -f out/plan/plan_result.json ]; then
            echo "## DCM Plan Output" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat out/plan/plan_result.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  validate-streamlit:
    name: Streamlit Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install streamlit

      - name: Check Streamlit app syntax
        run: python -c "import ast; ast.parse(open('streamlit/streamlit_app.py').read())"

  lint-naming:
    name: Naming Conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check UPPER_SNAKE_CASE naming
        run: python scripts/check_naming.py

  validate-agent:
    name: Agent Spec Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate agent spec
        run: python scripts/validate_agent_spec.py

      - name: Validate agent deploy script (dry-run)
        run: python scripts/deploy_agent.py --dry-run

      - name: Validate eval config + ground truth (dry-run)
        run: |
          pip install pyyaml
          python agent/evals/run_evals.py --dry-run

  validate-dbt:
    name: dbt Compile & Parse
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake

      - name: Write dbt profiles
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          tpch_data_platform:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: "xna38553.east-us-2.azure"
                user: "MCP_SERVICE_USER"
                authenticator: oauth
                token: "${{ secrets.SNOWFLAKE_PAT }}"
                role: SYSADMIN
                database: SANDBOX
                warehouse: ANALYTICS_WH
                schema: TPCH_CI_${{ github.run_id }}
                threads: 4
                query_tag: "dbt_ci_pr_${{ github.event.number }}"
          EOF

      - name: dbt deps
        run: dbt deps

      - name: dbt compile (all models)
        run: dbt compile

      - name: dbt parse
        run: dbt parse

  validate-ingestion:
    name: Openflow Flow Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install nipyapi
        run: pip install nipyapi pyyaml

      - name: Parse Openflow flow files (syntax)
        run: |
          for f in ingestion/openflow/flows/*.py; do
            echo "Parsing $f..."
            python -c "import ast; ast.parse(open('$f').read())"
          done
          echo "All Openflow flow files are syntactically valid."

      - name: Dry-run all flows (validates flow config structure)
        run: |
          python ingestion/openflow/flows/deploy_all_flows.py --dry-run

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Bandit (Python security)
        run: |
          pip install bandit
          bandit -r streamlit/ scripts/ agent/ ingestion/ \
            --severity-level medium --confidence-level medium \
            --exclude ingestion/openflow/flows/

      - name: Run Gitleaks (secret detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
