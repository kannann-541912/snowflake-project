name: dbt Snowflake CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dbt-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dbt Snowflake
        run: |
          pip install --upgrade pip
          pip install dbt-snowflake

      - name: Install dbt dependencies
        # If your profiles.yml is in the root, pass --profiles-dir .
        run: dbt deps --profiles-dir .

      # The env block injects your GitHub secret into the runner environment
      - name: Test Snowflake Connection
        env:
          SNOWFLAKE_PAT: ${{ secrets.SNOWFLAKE_PAT }} 
        run: dbt debug --profiles-dir .

      - name: Run dbt Models
        env:
          SNOWFLAKE_PAT: ${{ secrets.SNOWFLAKE_PAT }}
        run: dbt run --profiles-dir .
