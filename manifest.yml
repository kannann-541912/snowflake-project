manifest_version: 2
type: DCM_PROJECT
default_target: 'DEV'

targets:
  DEV:
    project_name: 'SANDBOX.TPCH.DATA_PLATFORM_DEV'
    project_owner: ACCOUNTADMIN
    account_identifier: 'A5701997473071-MPA05784'
    templating_config: 'DEV'
  PROD:
    project_name: 'SANDBOX.TPCH.DATA_PLATFORM'
    project_owner: ACCOUNTADMIN
    account_identifier: 'A5701997473071-MPA05784'
    templating_config: 'PROD'
  # CI target — database name is SANDBOX_CI (placeholder).
  # In CI the deploy workflow replaces SANDBOX_CI with the actual
  # branch clone database name (e.g. SANDBOX_FEATURE_NEW_AGENT) via sed.
  CI:
    project_name: 'SANDBOX_CI.TPCH.DATA_PLATFORM_CI'
    project_owner: CI_DEPLOY_ROLE
    account_identifier: 'A5701997473071-MPA05784'
    templating_config: 'DEV'

templating:
  defaults:
    env_suffix: '_DEV'
    wh_size: 'XSMALL'
  configurations:
    DEV:
      env_suffix: '_DEV'
      wh_size: 'XSMALL'
    PROD:
      env_suffix: ''
      wh_size: 'MEDIUM'
