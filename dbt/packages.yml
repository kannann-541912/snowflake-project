packages:
  # dbt utility macros (cross_db_utils, date_spine, surrogate_key, etc.)
  - package: dbt-labs/dbt_utils
    version: [">=1.3.0", "<2.0.0"]

  # Data quality tests beyond dbt's built-in set
  # (expect_column_values_to_not_be_null, expect_row_count_to_be_between, etc.)
  - package: calogica/dbt_expectations
    version: [">=0.10.0", "<1.0.0"]

  # Audit helper: compare row counts and values across runs
  - package: dbt-labs/audit_helper
    version: [">=0.12.0", "<1.0.0"]

  # Codegen: auto-generate source YAML and model YAML from Snowflake schema
  - package: dbt-labs/codegen
    version: [">=0.13.0", "<1.0.0"]

  # Elementary: data observability — disabled in CI due to Snowflake SQL compatibility issue
  # (on-run-end hooks use 'order' as an unquoted identifier, causing SQL compilation errors)
  # Re-enable after running: dbt run --select elementary  to initialize its schema first.
  # - package: elementary-data/elementary
  #   version: [">=0.16.0", "<1.0.0"]
