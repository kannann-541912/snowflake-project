version: 2

models:
  - name: stg_customers
    description: "Staging layer for customers — renamed, trimmed, lowercased"
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique
      - name: customer_name
        tests:
          - not_null
      - name: email
        tests:
          - not_null

  - name: stg_orders
    description: "Staging layer for orders — renamed, status normalized to uppercase"
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: status
        tests:
          - accepted_values:
              values: ["PENDING", "SHIPPED", "DELIVERED", "CANCELLED", "RETURNED"]
