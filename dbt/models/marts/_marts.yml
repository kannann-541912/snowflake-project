version: 2

models:
  - name: fct_customer_orders
    description: >
      Customer order summary fact table. Authoritative mart consumed by the
      Cortex Agent (via semantic view), Streamlit dashboard, and BI tools.
      Incrementally updated on MERGE using customer_id as the unique key.
    meta:
      owner: "data-platform-team"
      pii_columns: ["email"]
      sla_hours: 8

    columns:
      - name: customer_sk
        description: "Surrogate key (dbt_utils.generate_surrogate_key on customer_id)"
        tests:
          - not_null
          - unique

      - name: customer_id
        description: "Natural key from source CUSTOMERS table"
        tests:
          - not_null
          - unique

      - name: customer_name
        tests:
          - not_null

      - name: email
        meta:
          pii: true

      - name: total_orders
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

      - name: lifetime_value
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

      - name: customer_segment
        tests:
          - accepted_values:
              values: ["NO_ORDERS", "ACTIVE", "AT_RISK", "LAPSED"]

      - name: cancellation_rate_pct
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100

      - name: dbt_updated_at
        tests:
          - not_null
