# Cortex Agent Evaluation Configuration
# Evaluation uses SNOWFLAKE.CORTEX.AI_JUDGE for LLM-as-judge scoring.

eval_suite:
  name: "TPCH_ANALYST_EVALS"
  description: "Ground-truth evaluation suite for TPCH_ANALYST Cortex Agent"
  version: "1.0.0"

# Snowflake connection settings (uses config.toml or ~/.snowflake/config.toml)
connection:
  profile: "default"
  account: "xna38553.east-us-2.azure"
  user: "MCP_SERVICE_USER"
  database: "SANDBOX"
  schema: "TPCH"
  warehouse: "ANALYTICS_WH"

# Agent under evaluation
agent:
  fqn: "SANDBOX.TPCH.TPCH_ANALYST"
  # Override to test a specific spec version before deploying
  spec_version: null  # e.g. "v2" — null means use the currently deployed agent

# Judge model for LLM-as-judge scoring via SNOWFLAKE.CORTEX.AI_JUDGE
judge:
  model: "llama3.1-70b"
  # Criteria scored 0.0–1.0 by the judge
  criteria:
    - name: "correctness"
      description: "The answer correctly addresses the question using real query results"
      weight: 0.5
    - name: "groundedness"
      description: "The answer is grounded in the data returned by the tool — no hallucination"
      weight: 0.3
    - name: "completeness"
      description: "The answer covers all aspects of the question without missing key data"
      weight: 0.2

# Pass/fail thresholds
thresholds:
  overall_pass_score: 0.80        # Weighted average score to pass the suite
  per_question_min_score: 0.60    # Any single question below this fails the suite
  tool_call_accuracy: 1.0         # All questions must call the expected tool

# Results output
results:
  output_dir: "agent/evals/results"
  write_to_snowflake: true        # Also persist results to SANDBOX.TPCH.AGENT_EVAL_RESULTS
  table: "SANDBOX.TPCH.AGENT_EVAL_RESULTS"

# Ground truth file
ground_truth_file: "agent/evals/ground_truth.json"
