eval_suite:
  name: "RETAIL_CATEGORY_ANALYTICS_AGENT_EVALS"
  description: "Ground-truth evaluation suite for Retail Category Analytics Cortex Agent"
  version: "1.0.0"

connection:
  profile: "default"
  account: "xna38553.east-us-2.azure"
  user: "MCP_SERVICE_USER"
  database: "DEMO_DEV"
  schema: "RETAIL_CATEGORY_ANALYTICS_AGENT"
  warehouse: "RETAIL_CATEGORY_ANALYTICS_WH"

agent:
  fqn: "DEMO_DEV.RETAIL_CATEGORY_ANALYTICS_AGENT.RETAIL_CATEGORY_ANALYTICS_AGENT"
  spec_version: null

judge:
  model: "llama3.1-70b"
  criteria:
    - name: "correctness"
      description: "The answer correctly addresses the question using real query results"
      weight: 0.5
    - name: "groundedness"
      description: "The answer is grounded in tool results — no hallucination"
      weight: 0.3
    - name: "completeness"
      description: "The answer covers all aspects of the question"
      weight: 0.2

thresholds:
  overall_pass_score: 0.80
  per_question_min_score: 0.60
  tool_call_accuracy: 1.0

results:
  output_dir: "agent/agents/retail-category-analytics/evals/results"
  write_to_snowflake: true
  table: "DEMO_DEV.RETAIL_CATEGORY_ANALYTICS_AGENT.AGENT_EVAL_RESULTS"

ground_truth_file: "agent/agents/retail-category-analytics/evals/ground_truth.json"
